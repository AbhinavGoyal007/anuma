name: CI

# The gate the audit asked for: every check that can fail the product runs on
# every push, and the authenticated Intelligence suite is counted rather than
# assumed. A run where zero Intelligence tests executed is a failed run — that
# was the exact shape of the previous problem, where the suite skipped itself
# and reported green.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DEMO_AUTOLOGIN_EMAIL: ${{ secrets.DEMO_AUTOLOGIN_EMAIL }}
      DEMO_AUTOLOGIN_PASSWORD: ${{ secrets.DEMO_AUTOLOGIN_PASSWORD }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json

      - name: Count executed Intelligence tests
        if: always()
        run: node scripts/report-e2e-coverage.mjs playwright-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
